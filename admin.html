<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة المتجر | HONOR AL-DIWANIYAH</title><link rel="stylesheet" href="styles.css"><style>
.admin-wrap{max-width:1100px;margin:40px auto;padding:0 18px}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.admin-card{border:1px solid var(--line);border-radius:16px;padding:20px;margin:20px 0}.admin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.admin-grid label{font-size:12px;font-weight:700}.admin-grid input,.admin-grid select{display:block;width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;margin-top:6px}.admin-table{width:100%;border-collapse:collapse;font-size:13px}.admin-table td,.admin-table th{padding:12px;border-bottom:1px solid var(--line);text-align:right}.admin-table button{border:0;border-radius:7px;padding:7px 10px;cursor:pointer}.muted{color:var(--muted);font-size:12px}@media(max-width:650px){.admin-grid{grid-template-columns:1fr}.admin-table{font-size:11px}}
</style></head><body>
<header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">H</span><span><b>HONOR</b><small>AL-DIWANIYAH</small></span></a><a href="index.html">العودة للمتجر ←</a></header>
<main class="admin-wrap">
 <div class="admin-top"><div><span class="eyebrow">STORE MANAGEMENT</span><h1>لوحة إدارة المتجر</h1><p class="muted">إدارة المنتجات والطلبات. يتطلب تفعيل Supabase وإضافة حساب موظف.</p></div><span class="badge" id="connection">وضع تجريبي</span></div>
 <section class="admin-card"><h2>إضافة منتج</h2><form id="product-form" class="admin-grid">
 <label>اسم المنتج<input name="name" required placeholder="HONOR X9d"></label>
 <label>القسم<select name="category"><option>هواتف</option><option>تابلت</option><option>إكسسوارات</option></select></label>
 <label>السعر بالدينار<input name="price" type="number" min="0" required></label>
 <label>وصف مختصر<input name="description"></label><label>رابط الصورة<input name="image" type="url" placeholder="https://..."></label>
 <label>شارة (اختياري)<input name="tag" placeholder="جديد"></label>
 <button class="primary-btn" type="submit">إضافة المنتج</button></form></section>
 <section class="admin-card"><h2>المنتجات الحالية</h2><div style="overflow:auto"><table class="admin-table"><thead><tr><th>المنتج</th><th>القسم</th><th>السعر</th><th>إجراء</th></tr></thead><tbody id="admin-products"></tbody></table></div></section>
 <section class="admin-card"><h2>الطلبات</h2><div style="overflow:auto"><table class="admin-table"><thead><tr><th>رقم الطلب</th><th>الزبون</th><th>الهاتف</th><th>المحافظة</th><th>المجموع</th><th>الحالة</th></tr></thead><tbody id="admin-orders"></tbody></table></div></section>
</main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const cfg=window.STORE_CONFIG||{},connected=!!(cfg.supabaseUrl&&cfg.supabaseAnonKey);let sb=connected?supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey):null;
const money=n=>new Intl.NumberFormat("en-US").format(n)+" د.ع";const demo=[{id:"p1",name:"HONOR X9d",category:"هواتف",price:493000},{id:"p2",name:"HONOR 600",category:"هواتف",price:645000}];
async function init(){document.getElementById("connection").textContent=connected?"قاعدة البيانات مهيأة — سجّل الدخول مطلوب":"وضع تجريبي محلي";
 if(sb){const {data:{session}}=await sb.auth.getSession();if(!session){document.querySelector(".admin-wrap").insertAdjacentHTML("afterbegin",'<section class="admin-card"><h2>تسجيل دخول الموظف</h2><form id="login" class="admin-grid"><label>البريد الإلكتروني<input name="email" type="email" required></label><label>كلمة المرور<input name="password" type="password" required></label><button class="primary-btn">دخول</button></form></section>');document.getElementById("login").onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);let r=await sb.auth.signInWithPassword({email:f.get("email"),password:f.get("password")});if(r.error)alert("تعذر تسجيل الدخول");else location.reload()};return}}
 renderProducts();renderOrders();}
function renderProducts(){let ps=JSON.parse(localStorage.getItem("honor-admin-products")||"null")||demo;document.getElementById("admin-products").innerHTML=ps.map(p=>`<tr><td>${p.name}</td><td>${p.category}</td><td>${money(p.price)}</td><td><button data-del="${p.id}">حذف</button></td></tr>`).join("");document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ps=ps.filter(p=>p.id!==b.dataset.del);localStorage.setItem("honor-admin-products",JSON.stringify(ps));renderProducts()})}
function renderOrders(){let os=JSON.parse(localStorage.getItem("honor-demo-orders")||"[]");document.getElementById("admin-orders").innerHTML=os.map(o=>`<tr><td>${o.id}</td><td>${o.customer_name}</td><td>${o.phone}</td><td>${o.governorate}</td><td>${money(o.total)}</td><td>${o.status}</td></tr>`).join("")||'<tr><td colspan="6">لا توجد طلبات تجريبية.</td></tr>'}
document.getElementById("product-form").onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),p={id:"local-"+Date.now(),name:f.get("name"),category:f.get("category"),price:Number(f.get("price")),description:f.get("description"),image:f.get("image"),tag:f.get("tag")};let ps=JSON.parse(localStorage.getItem("honor-admin-products")||"null")||demo;ps.unshift(p);localStorage.setItem("honor-admin-products",JSON.stringify(ps));alert("تمت الإضافة في وضع العرض المحلي. الربط بقاعدة البيانات مطلوب للنشر.");e.target.reset();renderProducts()};
init();
</script></body></html>
